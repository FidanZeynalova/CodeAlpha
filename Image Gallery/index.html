<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/style.css">
    <script type="module" src="./script.js"></script>
    <title>Image Gallery</title>
</head>

<body>
    <div class="head">
        <div class="logo">
            <h1>Code<span style="color: #0606d9ee;">Alpha</span></h1>
        </div>
        <div class="navbar">
            <ul>
                <li class="filter-btn active" data-filter="all">All</li>
                <li class="filter-btn" data-filter="nature">Nature</li>
                <li class="filter-btn" data-filter="science">Science</li>
                <li class="filter-btn" data-filter="people">People</li>
            </ul>
        </div>
    </div>

    <div class="main">
        <div class="images-wrapper">
            <div class="image" data-category="science">
                <img src="./assets/images/science.jpeg">
            </div>
            <div class="image" data-category="nature">
                <img src="./assets/images/nature.jpeg">
            </div>
            <div class="image" data-category="nature">
                <img src="./assets/images/nature-2.jpeg">
            </div>
            <div class="image" data-category="science">
                <img src="./assets/images/science-2.jpeg">
            </div>
            <div class="image" data-category="science">
                <img src="./assets/images/science-3.jpeg">
            </div>
            <div class="image" data-category="nature">
                <img src="./assets/images/nature-3.jpeg">
            </div>
            <div class="image" data-category="people">
                <img src="./assets/images/people.jpeg">
            </div>
            <div class="image" data-category="people">
                <img src="./assets/images/people-4.jpeg">
            </div>
            <div class="image" data-category="people">
                <img src="./assets/images/people-3.jpeg">
            </div>
            <div class="image" data-category="nature">
                <img src="./assets/images/nature-4.jpeg">
            </div>
            <div class="image" data-category="people">
                <img src="./assets/images/people-2.jpeg">
            </div>
        </div>

        <div class="modal">
            <div class="buttons">
                <button id="prev">&#8592;</button>
                <button id="next">&#8594;</button>
            </div>
            <div class="image">
                <button id="close">X</button>
                <img src="" </div>
            </div>
        </div>
</body>

</html>
